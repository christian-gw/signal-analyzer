[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-analyzer"
version = "0.1.0"
description = "Small DSP toolkit for vibration, order, spatial, and envelope analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dsp", "vibration", "order-analysis", "signal-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
]

[project.optional-dependencies]
test = [
    "pytest",
]
examples = [
    "ipykernel",
    "jupyter",
    "matplotlib",
    "nbclient",
    "nbformat",
]

[project.urls]
Repository = "https://github.com/christian-gw/signal-analyzer"
Issues = "https://github.com/christian-gw/signal-analyzer/issues"

[tool.setuptools.packages.find]
where = ["src"]
